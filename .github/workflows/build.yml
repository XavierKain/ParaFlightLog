name: Build check

# Compile-check CI: builds the iOS app (which also builds the embedded
# Watch app and widget via target dependencies) for the simulator, without
# code signing. Free on public repos. Errors surface as check-run
# annotations readable via the GitHub API.

on:
  push:
    branches: [v20, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS + watchOS (simulator, no signing)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Lets SPM download the Mapbox SDK binaries once the package is added
      # to the project (see MAPBOX_SETUP.md). No-op while the secret is unset.
      - name: Configure Mapbox SDK download token (if set)
        env:
          MAPBOX_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOAD_TOKEN }}
        run: |
          if [ -n "$MAPBOX_DOWNLOAD_TOKEN" ]; then
            printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' "$MAPBOX_DOWNLOAD_TOKEN" > ~/.netrc
            chmod 600 ~/.netrc
            echo "Mapbox .netrc configured"
          else
            echo "MAPBOX_DOWNLOAD_TOKEN not set - skipping"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build ParaFlightLog scheme
        run: |
          set -o pipefail
          build() {
            xcodebuild build \
              -project ParaFlightLog.xcodeproj \
              -scheme ParaFlightLog \
              -destination 'generic/platform=iOS Simulator' \
              -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              2>&1
          }
          if command -v xcbeautify >/dev/null 2>&1; then
            build | xcbeautify --renderer github-actions
          else
            build
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone [^(]+" | head -1 | xargs)
          echo "Using simulator: $DEVICE"
          run_tests() {
            xcodebuild test \
              -project ParaFlightLog.xcodeproj \
              -scheme ParaFlightLog \
              -destination "platform=iOS Simulator,name=$DEVICE" \
              -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              2>&1
          }
          # Keep the raw log: xcbeautify swallows crash details when the
          # test host dies mid-run.
          if command -v xcbeautify >/dev/null 2>&1; then
            run_tests | tee /tmp/raw-test.log | xcbeautify --renderer github-actions || {
              echo "=== RAW TEST LOG TAIL (crash context) ==="
              grep -n -i -B2 -A8 "fatal error\|crashed\|signal\|exited unexpectedly\|precondition\|Restarting" /tmp/raw-test.log | tail -120 || true
              tail -80 /tmp/raw-test.log
              exit 1
            }
          else
            run_tests
          fi
